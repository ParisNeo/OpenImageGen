[settings]
default_model = "stable_diffusion_1_5"
# Fail at startup rather than silently running GPU requests on CPU.
force_gpu = true
use_gpu = true
dtype = "float16"
auto_download_models = true
output_folder = "./outputs"
model_cache_dir = "./models"
asset_dir = "./model_assets"
max_asset_upload_gb = 32
port = 8089
host = "0.0.0.0"
file_retention_time = 3600
cleanup_interval_seconds = 900

[generation]
guidance_scale = 7.5
num_inference_steps = 50
num_images_per_prompt = 1

[auth]
enabled = false
allow_anonymous = true

[execution]
max_workers = 2
max_concurrent_jobs_per_user = 1

# Trusted server-side workflow plugins. Only enable for code you have reviewed.
[plugins]
enabled = false
paths = ["./nodes"]

[models.stable_diffusion_1_5]
name = "runwayml/stable-diffusion-v1-5"
type = "stable_diffusion"

[models.stable_diffusion_xl]
name = "stabilityai/stable-diffusion-xl-base-1.0"
type = "stable_diffusion_xl"

[models.dreamshaper_8]
name = "Lykon/dreamshaper-8"
type = "stable_diffusion"

[models.realistic_vision_v6]
name = "SG161222/Realistic_Vision_V6.0_B1_noVAE"
type = "stable_diffusion"

[models.sd_turbo]
name = "stabilityai/sd-turbo"
type = "stable_diffusion"

[models.sdxl_turbo]
name = "stabilityai/sdxl-turbo"
type = "stable_diffusion_xl"

[models.stable_diffusion_3_5_medium]
name = "stabilityai/stable-diffusion-3.5-medium"
type = "stable_diffusion_3"

[models.pixart_sigma_1024]
name = "PixArt-alpha/PixArt-Sigma-XL-2-1024-MS"
type = "pixart_sigma"

[models.sana_1_6b_1024]
name = "Efficient-Large-Model/Sana_1600M_1024px_BF16_diffusers"
type = "sana"
variant = "bf16"

[models.gpt_image_1]
name = "gpt-image-1"
type = "openai_image"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
timeout_seconds = 180

[models.dall_e_3]
name = "dall-e-3"
type = "openai_image"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
timeout_seconds = 180

[models.openai_gpt_image_1]
name = "openai/gpt-image-1"
type = "openai_image"
remote_model = "gpt-image-1"
api_key_env = "OPENAI_API_KEY"
quality = "high"

[models.openai_dall_e_3]
name = "openai/dall-e-3"
type = "openai_image"
remote_model = "dall-e-3"
api_key_env = "OPENAI_API_KEY"
quality = "hd"

[models.qwen_image]
name = "Qwen/Qwen-Image"
type = "qwen_image"

[models.flux_schnell]
name = "black-forest-labs/FLUX.1-schnell"
type = "flux"

[models.flux_schnell_gguf_q2_k]
name = "Comfy-Org/FLUX.1-schnell"
type = "flux_gguf"
base_repositories = ["black-forest-labs/FLUX.1-schnell"]
gguf_source = "city96/FLUX.1-schnell-gguf"
gguf_filename = "flux1-schnell-Q2_K.gguf"
label = "FLUX.1-schnell · Q2_K"
quantization = "Q2_K"
catalog_preset = "flux-schnell-q2-k"

[models.flux_schnell_gguf_q4_k_s]
name = "black-forest-labs/FLUX.1-schnell"
type = "flux_gguf"
base_repositories = ["Comfy-Org/FLUX.1-schnell"]
gguf_source = "city96/FLUX.1-schnell-gguf"
gguf_filename = "flux1-schnell-Q4_K_S.gguf"
label = "FLUX.1-schnell · Q4_K_S"
quantization = "Q4_K_S"
catalog_preset = "flux-schnell-q4-k-s"

[auth.users]
